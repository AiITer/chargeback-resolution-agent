[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chargeback-resolution-agent"
version = "0.1.0"
description = "An event-driven AI agent for merchant chargeback resolution."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.0",
    "alembic>=1.14",
    "stripe>=16.0,<17.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
